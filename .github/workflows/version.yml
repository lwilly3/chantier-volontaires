name: Version

# Une étiquette vX.Y.Z poussée sur GitHub devient une « Release » : notes tirées de CHANGELOG.md
# et archives du code (zip, tar.gz) téléchargeables.
# Si le déclenchement automatique n'a pas eu lieu : Actions → Version → Run workflow, en indiquant l'étiquette.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      etiquette:
        description: "Étiquette déjà poussée (ex. v1.2.0)"
        required: true

permissions:
  contents: write

jobs:
  publier:
    runs-on: ubuntu-latest
    env:
      ETIQUETTE: ${{ inputs.etiquette || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.ETIQUETTE }}

      - name: Vérifier que l'étiquette correspond au numéro du code
        run: python3 scripts/publier_version.py --verifier "$ETIQUETTE"

      - name: Extraire les notes de version
        run: python3 scripts/publier_version.py --notes "$ETIQUETTE" > notes.md

      - name: Créer ou mettre à jour la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$ETIQUETTE" > /dev/null 2>&1; then
            gh release edit "$ETIQUETTE" --title "Version ${ETIQUETTE#v}" --notes-file notes.md
          else
            gh release create "$ETIQUETTE" --title "Version ${ETIQUETTE#v}" --notes-file notes.md --verify-tag
          fi
